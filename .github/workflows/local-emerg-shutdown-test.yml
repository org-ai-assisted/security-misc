## AI-Assisted

## Regression test for emerg-shutdown keyboard hotplug.
##
## Asserts that a keyboard plugged in AFTER emerg-shutdown starts is
## monitored for the panic key combo via its inotify watch on /dev/input,
## with no service restart. See
## ci/tests/emerg_shutdown/test_keyboard_hotplug.py.

name: Test emerg-shutdown

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test emerg-shutdown
    runs-on: ubuntu-latest
    timeout-minutes: 10

    ## CI runs only where we enabled it; ANDed with the existing guard.
    ## Unset variable -> skipped, no runner, run stays green.
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      ## gcc + static glibc compile the binary at test time via the repo's
      ## own compile-emerg-shutdown helper; python3-evdev drives the virtual
      ## keyboards.
      - name: Install build and test dependencies
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install --yes --no-install-recommends \
            gcc libc6-dev linux-libc-dev python3-evdev

      ## uinput provides the virtual keyboards the test hotplugs.
      - name: Load uinput kernel module
        run: |
          sudo modprobe uinput
          test -e /dev/uinput

      - name: Keyboard hotplug regression test
        ## Root: needs /dev/uinput and must run emerg-shutdown (root-only).
        run: sudo -E ci/tests/emerg_shutdown/test_keyboard_hotplug.py
